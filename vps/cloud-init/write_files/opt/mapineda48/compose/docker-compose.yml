version: "3.9"

networks:
  mapineda48-net:
    name: mapineda48-net

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.9
    container_name: mapineda48-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      TRUST_DOWNSTREAM_PROXY: "false"
    volumes:
      # Persistent certificates in Azure Blob Storage (survives redeploys)
      - /mnt/deploy/vm/agape.js/docker/certs:/etc/nginx/certs
      # Local disk: configuration from repo (recreated on each deploy)
      - /opt/mapineda48/nginx-conf/vhost.d:/etc/nginx/vhost.d
      - /opt/mapineda48/nginx-conf/html:/usr/share/nginx/html
      # Docker socket for dynamic configuration
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - mapineda48-net
    restart: unless-stopped

  nginx-proxy-acme:
    image: nginxproxy/acme-companion:2.6
    container_name: mapineda48-acme
    environment:
      DEFAULT_EMAIL: ${MAPINEDA48_EMAIL_ACME}
      ACME_CA_URI: https://acme-v02.api.letsencrypt.org/directory
      NGINX_PROXY_CONTAINER: mapineda48-proxy
    volumes:
      # Persistent certificates and ACME state in Azure Blob Storage
      - /mnt/deploy/vm/agape.js/docker/certs:/etc/nginx/certs:rw
      - /mnt/deploy/vm/agape.js/docker/acme:/etc/acme.sh
      # Local disk: configuration from repo (same as nginx-proxy)
      - /opt/mapineda48/nginx-conf/vhost.d:/etc/nginx/vhost.d
      - /opt/mapineda48/nginx-conf/html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mapineda48-net
    depends_on:
      - nginx-proxy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mapineda48-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      # Bind explicitly to IPv4 so nginx-proxy can reach it over the Docker IPv4 network
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: 80
      # nginx-proxy integration
      VIRTUAL_HOST: ${PGADMIN_VIRTUAL_HOST}
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ${PGADMIN_VIRTUAL_HOST}
      LETSENCRYPT_EMAIL: ${MAPINEDA48_EMAIL_ACME}
    volumes:
      # Persist pgAdmin data on local disk (SQLite on blobfuse can be unreliable)
      - /opt/mapineda48/data/pgadmin:/var/lib/pgadmin
    networks:
      - mapineda48-net
    depends_on:
      - nginx-proxy
    restart: unless-stopped
